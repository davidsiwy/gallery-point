:root{--portrait-uri:url("data:image/svg+xml,%3Csvg viewBox=%270 0 78 100%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cpath d=%27M%201.1425%202.7752%20L%200.5879%200.4762%20H%2076.7526%20L%2076.5677%201.0509%20L%2076.1980%202.9668%20L%2075.8282%204.8826%20L%2075.4585%206.7984%20L%2075.0888%208.7142%20L%2074.7190%2010.6300%20L%2074.3493%2012.5458%20L%2073.9796%2014.4616%20L%2073.6099%2016.3774%20V%2084.1973%20L%2073.9796%2086.1131%20L%2074.3493%2088.0290%20L%2074.7190%2089.9448%20L%2075.0888%2091.8606%20L%2075.4585%2093.7764%20L%2075.8282%2095.6924%20L%2076.1980%2097.6076%20L%2076.5677%2099.5238%20H%200.7727%20L%201.1425%2097.6076%20L%201.5122%2095.6924%20L%201.8819%2093.7764%20L%202.2517%2091.8606%20L%202.6214%2089.9448%20L%202.9911%2088.0290%20L%203.3609%2086.1131%20L%203.7306%2084.1973%20V%2016.3774%20L%203.3609%2014.4616%20L%202.9911%2012.5458%20L%202.6214%2010.6300%20L%202.2517%208.7142%20L%201.8819%206.7984%20L%201.5122%204.8826%20L%201.1425%202.7752%20Z%27 fill=%27%23101010%27/%3E%3C/svg%3E")}
:root{--wall:#FFFFFF;--mat:#FCFBF9;--stone:#EBEBEB;--graphite:#878787;--faint:#C9C2B8;--ink:#0A0A0A;--brick:#705941;--bronze:#8A6746;--rust:#A34A2B;
--serif:"Larken","Fraunces",Georgia,serif;--sans:"Saans","Hanken Grotesk","Inter",-apple-system,Helvetica,Arial,sans-serif;--hand:"Caveat",cursive;
--pad:clamp(16px,2.6vw,52px);--hairline:rgba(10,10,10,.13)}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-Thin.woff2") format("woff2");font-weight:100;font-style:normal;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-ThinItalic.woff2") format("woff2");font-weight:100;font-style:italic;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:block}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-LightItalic.woff2") format("woff2");font-weight:300;font-style:italic;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-MediumItalic.woff2") format("woff2");font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-BoldItalic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-ExtraBold.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-ExtraBoldItalic.woff2") format("woff2");font-weight:800;font-style:italic;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-Black.woff2") format("woff2");font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Larken";src:url("assets/fonts/Larken-BlackItalic.woff2") format("woff2");font-weight:900;font-style:italic;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--serif);font-optical-sizing:auto;background:var(--wall);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--ink);color:var(--wall)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
.ph{position:relative;overflow:hidden;background:var(--stone)}
.ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.88) contrast(1.02)}
.ph.img-missing{background:var(--stone) var(--portrait-uri) center / auto 44% no-repeat}
.label{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--graphite)}
.label b{color:var(--ink);font-weight:600}
.fine{font-family:var(--sans);font-size:11px;font-weight:450;letter-spacing:.04em;color:var(--graphite);line-height:1.85}
h1,h2,h3{font-weight:380;line-height:.96;letter-spacing:-0.04em}
.anno{font-family:var(--hand);color:var(--bronze);font-size:clamp(1.1rem,1.7vw,1.4rem);line-height:1;white-space:nowrap}
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s ease var(--d,0s),transform 1s cubic-bezier(.22,.8,.2,1) var(--d,0s)}
.rv.on{opacity:1;transform:none}
svg.draw path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)}
svg.draw.go path{stroke-dashoffset:0 !important}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.dot.done{background:var(--ink)}.dot.prog{background:var(--brick)}.dot.prep{background:transparent;border:1px solid var(--ink)}
.hl{position:relative}
.hl::after{content:"";position:absolute;left:0;bottom:-2px;height:1px;width:0;background:var(--ink);transition:width .35s ease}
a:hover .hl::after,a.hl:hover::after{width:100%}
/* header */
#ph{position:fixed;top:0;left:0;right:0;z-index:90;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:16px var(--pad);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .4s ease}
#ph.sc{border-bottom-color:var(--hairline)}
.ph-col{justify-self:start;display:inline-flex;align-items:center;gap:9px;color:var(--ink)}
.ph-col .aw{display:none;width:15px;height:auto}
.ph-col .cw{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.ph-col sup{font-family:var(--sans);font-size:8.5px;font-weight:600;letter-spacing:.06em;background:var(--ink);color:#fff;padding:3px 5.5px;line-height:1;transform:translateY(-1px)}
.ph-wm{justify-self:center;display:inline-flex;align-items:center;font-size:1.05rem;letter-spacing:-.03em;white-space:nowrap}
.ph-wm em{font-style:normal;font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:#fff;padding:5px 9px 4px;margin:0 11px;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.ph-r{justify-self:end;display:inline-flex;align-items:center;gap:22px}
.ph-con{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
#langs{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.18em}
#langs span{cursor:pointer;opacity:.4;transition:opacity .3s}
#langs span.on{opacity:1}
#langs i{font-style:normal;opacity:.3}
/* title + meta + cover */
.pt-hero{padding:clamp(118px,17vh,190px) var(--pad) 0}
.pt-hero h1{font-size:clamp(2.9rem,8.6vw,7.6rem);text-align:center;color:var(--bronze);letter-spacing:-.045em}
.pt-meta{margin-top:clamp(28px,4.5vh,50px);display:flex;justify-content:space-between;align-items:center;gap:12px 30px;flex-wrap:wrap}
.pt-meta .st{display:inline-flex;align-items:center;gap:9px}
.pt-meta .sold{color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.pt-meta .sold svg{width:11px;height:auto;stroke:var(--ink);stroke-width:2.6;fill:none}
.pt-cover{margin-top:clamp(26px,4.5vh,52px)}
.pt-cover .ph{aspect-ratio:16/7.7}
/* intent */
.pt-int{display:grid;grid-template-columns:minmax(150px,24%) minmax(0,680px);column-gap:clamp(34px,7vw,120px);padding:clamp(96px,15vh,190px) var(--pad);align-items:start}
.pt-int>.label{margin-top:8px}
.pt-int .big{font-size:clamp(1.45rem,2.5vw,2.15rem);font-weight:390;line-height:1.42;letter-spacing:-.015em}
.pt-int .int-p{grid-column:2;font-family:var(--sans);font-size:1.02rem;font-weight:360;line-height:1.72;margin-top:24px;max-width:580px;color:#2e2e2e}
.pt-int .int-p + .int-p{margin-top:16px}
/* making path */
.pt-path{display:grid;grid-template-columns:minmax(150px,24%) minmax(0,440px) minmax(0,1fr);column-gap:clamp(30px,5.5vw,96px);padding:0 var(--pad) clamp(96px,15vh,190px);align-items:start}
.pt-path>.label{margin-top:8px}
.spec-frame{border:1px solid var(--hairline);background:var(--mat);position:relative}
.sk .spec-frame{padding:clamp(24px,3.6vw,54px)}
.sk .anno{position:absolute;right:7%;top:8%;transform:rotate(-6deg)}
.psketch{width:100%;height:auto}
.psketch path{stroke:#4A4038;stroke-width:2.4}
.skimg{display:block;width:100%;height:auto;clip-path:inset(0 100% 0 0);transition:clip-path 1.9s cubic-bezier(.4,0,.2,1) .35s}
.rv.on .skimg,.rv.on + * .skimg{clip-path:inset(0 0 0 0)}
.sk .cap{display:block;margin-top:13px}
.stages{list-style:none}
.stages li{font-size:clamp(1.35rem,1.95vw,1.8rem);line-height:1.45;padding:8px 0;color:var(--faint);letter-spacing:-.02em;display:flex;align-items:baseline;gap:15px}
.stages li.on{color:var(--ink)}
.stages li.cur::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bronze);flex:none;align-self:center}
.stages li .anno{transform:rotate(-4deg)}
.stages li.sold{color:var(--bronze)}
.stages li.sold svg{width:15px;height:auto;stroke:var(--bronze);stroke-width:2.6;fill:none;flex:none;align-self:center}
.pweb{margin-top:clamp(26px,4vh,42px)}
.imprint{margin-top:clamp(38px,7vh,72px);text-align:right}
.imprint .fine{display:block}
/* photo flow */
.flow{padding:0 var(--pad) clamp(50px,8vh,110px);display:flex;flex-direction:column;gap:clamp(18px,3vw,46px)}
.flow .f-full .ph{aspect-ratio:16/8.1}
.flow .f-half{width:min(620px,calc(50% - clamp(9px,1.5vw,23px)))}
.flow .f-half .ph{aspect-ratio:5/5.6}
.flow .f-half.r{align-self:flex-end}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,46px)}
.pair .ph{aspect-ratio:5/5.6}
.pair .spec-frame{display:flex;align-items:center;justify-content:center;padding:clamp(24px,4vw,60px)}
.pair .psketch{width:min(560px,86%)}
/* hotel extras */
.pt-hx{display:grid;grid-template-columns:minmax(150px,24%) minmax(0,1fr);column-gap:clamp(34px,7vw,120px);padding:0 var(--pad) clamp(80px,12vh,150px);align-items:start}
.pt-hx>.label{margin-top:6px}
.hx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3.4vw,54px)}
.hx-grid .cell{border-top:1px solid var(--hairline);padding-top:16px}
.hx-grid .tm{font-size:1.55rem;letter-spacing:-.02em;display:block}
.hx-grid p{font-family:var(--sans);font-size:.97rem;font-weight:380;color:#3c3c3c;margin-top:10px;line-height:1.6}
.eds{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3.4vw,54px)}
.ed{display:flex;flex-direction:column;gap:9px}
.ed svg{width:min(240px,78%);height:auto;margin-bottom:8px}
.ed .t{font-size:1.3rem;letter-spacing:-.02em}
/* next work */
.nextw{display:grid;grid-template-columns:1fr minmax(210px,300px) 1fr;align-items:center;gap:clamp(24px,4vw,70px);padding:clamp(90px,14vh,190px) var(--pad)}
.nextw .nw-l{font-size:clamp(1.5rem,2.4vw,2.1rem);letter-spacing:-.03em}
.nextw .nw-img .ph{aspect-ratio:3/4}
.nextw .nw-img .ph img{transition:transform 1s cubic-bezier(.22,.8,.2,1)}
.nextw:hover .nw-img .ph img{transform:scale(1.045)}
.nextw .nw-t{justify-self:end;text-align:right;font-size:clamp(1.9rem,3.6vw,3.2rem);letter-spacing:-.035em;color:var(--rust)}
/* footer */
.pf{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:clamp(34px,6vw,110px);padding:clamp(40px,7vh,110px) var(--pad) clamp(34px,5vh,64px);align-items:stretch}
.pf-card{position:relative}
.pf-card .ph{aspect-ratio:3/4.15;height:100%}
.pf-card .ph::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.16)}
.pf-wm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:1.25rem;letter-spacing:-.02em;z-index:2}
.pf-r{display:flex;flex-direction:column;justify-content:space-between;gap:44px;padding-top:6px}
.pf-touch h3{font-size:clamp(1.4rem,2vw,1.8rem);letter-spacing:-.03em;margin-bottom:18px}
.pf-touch a{display:block;font-family:var(--sans);font-size:.98rem;font-weight:430;padding:5px 0;width:max-content}
.pf-co{align-self:flex-end;text-align:right}
.pf-co .fine{display:block}
/* cursor */
#cur{position:fixed;left:0;top:0;width:9px;height:9px;border-radius:50%;background:#fff;mix-blend-mode:difference;z-index:300;pointer-events:none;transition:width .35s ease,height .35s ease}
#cur.big{width:42px;height:42px}
@media (pointer:coarse){#cur{display:none}}
/* mobile */
@media (max-width:760px){
#ph{padding:13px var(--pad)}
.ph-col .cw{display:none}
.ph-col .aw{display:block}
.ph-con{display:none}
.ph-wm{font-size:.95rem}
.ph-wm em{font-size:8px;padding:4px 7px;margin:0 8px;max-width:38vw;letter-spacing:.12em}
.pt-hero{padding-top:clamp(96px,14vh,140px)}
.pt-hero h1{font-size:clamp(2.5rem,12vw,4.2rem)}
.pt-meta{justify-content:flex-start;gap:10px 24px}
.pt-cover .ph{aspect-ratio:4/3.2}
.pt-int,.pt-path,.pt-hx{display:block}
.pt-int>.label,.pt-path>.label,.pt-hx>.label{display:block;margin-bottom:20px;margin-top:0}
.pt-int .big{font-size:1.35rem}
.pt-int .int-p{margin-top:18px}
.pt-path .sk{margin-bottom:36px}
.stages li{font-size:1.3rem}
.imprint{text-align:left;margin-top:42px}
.flow .f-half{width:100%}
.flow .f-half .ph{aspect-ratio:4/3.6}
.pair{grid-template-columns:1fr}
.hx-grid,.eds{grid-template-columns:1fr;gap:26px}
.nextw{grid-template-columns:1fr;gap:22px;padding:clamp(70px,10vh,110px) var(--pad)}
.nextw .nw-img{max-width:340px}
.nextw .nw-t{justify-self:start;text-align:left}
.pf{grid-template-columns:1fr;gap:40px}
.pf-card{max-width:420px}
.pf-co{align-self:flex-start;text-align:left}
}
</style>
</head>
<body>
<div id="cur"></div>
<header id="ph">
  <a class="ph-col" href="/#kolekce" aria-label="Kolekce"><svg class="aw" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="cw hl" data-i="n.kol"></span><sup>5</sup></a>
  <a class="ph-wm" href="/" aria-label="Gallery Point"><span>gallery</span><em>Vila GulfSide</em><span>point</span></a>
  <div class="ph-r">
    <button id="langs" aria-label="Language"><span data-l="cs">CZ</span><i>/</i><span data-l="en">EN</span></button>
    <a class="ph-con hl" href="/#kontakt" data-i="n.kon"></a>
  </div>
</header>
<section class="pt-hero">
  <h1 class="rv">Vila GulfSide</h1>
  <div class="pt-meta rv" style="--d:.12s">
    <span class="label"><span data-i="p.kicker"></span> 004</span>
    <span class="label">Longboat Key, Florida</span>
    <span class="label" data-i="w.004.t"></span>
    <span class="label st"><span class="dot prep"></span><span data-i="st.prep"></span></span>
    
  </div>
  <div class="pt-cover rv" style="--d:.2s"><div class="ph"><img src="assets/gulf-01-1600.jpg" alt="Vila GulfSide · Longboat Key, Florida" fetchpriority="high" onerror="imgFail(this)"></div></div>
</section>
<section class="pt-int">
  <span class="label" data-i="p.int"></span>
  <p class="big rv" data-i="w.004.i"></p>
    <p class="int-p rv" style="--d:.1s" data-i="w.004.p1"></p>
    <p class="int-p rv" style="--d:.18s" data-i="w.004.p2"></p>

ico": "IČO: 24517305", "kon.addr": "Nad Hlinkem 1202/2, Košiře, 150 00 Praha", "kon.copyright": "2026 © Gallery Point", "kon.ig": "Instagram", "hero.cta": "Prohlédnout kolekci", "kol.open": "Zobrazit dílo", "fil.l": "Filozofie", "fil.r": "Díla, ne projekty", "fil.big": "Trh staví projekty. My komponujeme <span class=\"em\">díla<svg class=\"u\" viewBox=\"0 0 200 12\" preserveAspectRatio=\"none\"><path d=\"M3 8 Q60 3 110 7 T197 6\"/></svg></span>.", "fil.p1": "Gallery Point vznikl z jednoduchého přesvědčení: dům může být umělecké dílo. Proto nestavíme portfolio, ale kolekci. Každé dílo nese číslo, má svůj záměr a své místo, a do kolekce vstupuje jen tehdy, když obstojí vedle ostatních. Začínáme vždy u pozemku, protože místo je jediná část díla, která se nedá navrhnout. Kupujeme poslední parcely ve čtvrtích, které mají jméno, výhledy, které nejde zastavět, břehy, na kterých už se stavět nebude.", "fil.p2": "Každé dílo pak držíme v jedněch rukou. Vlastníme ho, financujeme a řídíme, od první skici po předání, a stojí za námi soukromý kapitál a dvě dekády zkušeností mezi Prahou a Mexickým zálivem. Nemusíme dělat kompromisy, tak je neděláme. Kreslíme, dokud na stavbě nezbývá co vymýšlet, a předáváme, až když dům odpovídá výkresům. A měříme ho tím, co v něm zůstane, když se přestane počítat na metry: světlem, výhledem a tichem.", "w.001.p1": "Hřebenky patří k adresám, které se v Praze nekupují, ale dědí. Ulice starých vil, vzrostlých zahrad a ticha, které ve městě skoro vymizelo. Dům jsme komponovali tak, aby do ní patřil: klasický rukopis, kterým ulice mluví, a moderní prvky tam, kde slouží životu. Výjimečnost, která nepotřebuje vyčnívat. Tichý luxus v nejčistší podobě.", "w.001.p2": "Uvnitř je dům členěný do samostatných částí: velká rodina žije pod jednou střechou, a přesto každý ve svém. Ráno se potkáte u kávy, večer se rozejdete do vlastního klidu. Zahrada je odcloněná od okolí a komponovaná jako pokoj pod širým nebem. Zavřete branku a Praha zmizí. Zůstane světlo, zeleň a ticho.", "w.002.p1": "Jsou výhledy, které se v Praze fotí, a pak ty, se kterými se žije. Z Podolí se díváte přímo na Hrad a přes střechy na celé město: panorama, které večer potemní do siluety a ráno se rozsvítí dřív než ulice pod vámi. Takových míst je konečný počet. Tohle je jedno z posledních.", "w.002.p2": "Vzniká zde nová vila v moderním rukopisu, ve čtvrti, která se právě proměňuje a přitahuje lidi stejného měřítka. Sousedství, jaké se v Praze hledá těžko: nové domy, vlastní komunita, žádné kompromisy. Výhled zůstává navždy volný, do oken nikdo nevidí a zahrada je komponovaná jako místo klidu. A když vyrazíte, jste za pár minut v centru i na spojce, bez front a bez objíždění.", "w.003.p1": "Na Longboat Key existují ulice, které na mapě nenajdete náhodou. Tahle vede středem uzavřené klubové komunity, kde se sousedé znají jmény a cizí auta se tu neobjevují. Dům stojí přímo na kanále: u vlastního mola kotví loď a otevřené moře začíná pár minut plavby od snídaně.", "w.003.p2": "Rukopis patří renomovanému architektovi a je to znát. Velkorysé prostory, posazení, které z domu dělá jeden z nejvýraznějších v komunitě, a výhled, který se nedá naprojektovat: hladina kanálu prosvítající skrz bonsajové mangrovy, ráno stříbrná, večer zlatá. Dílo právě prochází proměnou. Až bude hotové, bude vypadat, jako by tu stálo odjakživa.", "w.004.p1": "Existuje jen málo míst, kde pláž začíná za vaší zahradou. Malá soukromá ulice, pár domů, a pak už jen bílý písek a Mexický záliv. Žádné hotely, žádní turisté, žádný ruch. Jen moře, které slyšíte oknem, a pláž, na které jsou večer jediné stopy ty vaše.", "w.004.p2": "Longboat Key si svou komornost hlídá: komerce sem nepatří a hlavní slovo má příroda. Ostrov, který zná celá Amerika, a přesto zůstal tichý. Zde vznikne rodinný dům komponovaný kolem jediného tématu: výhled na moře a světlo, které se nad zálivem každý večer mění v západ slunce. A když zatoužíte po městě, centrum Sarasoty je pár minut autem.", "w.005.p1": "Připravujeme proměnu v butikový resort, jaký na floridském pobřeží téměř vymizel: málo jednotek, hodně prostoru a moře na dosah ruky. Oceanfront v pravém smyslu slova. Ráno vás budí příboj, přes den patří pláž jen hostům a večer se z verandy díváte, jak slunce zapadá do zálivu.", "w.005.p2": "Pohostinnost zde chápeme jako kurátorství. Velkorysé jednotky komponované pro dlouhé pobyty a služby soustředěné na jediného člověka: hosta. Žádné davy a žádný hluk. Jen klid, kvalita v každém detailu a rytmus ostrova, který určuje moře. Místo, kam se lidé vracejí kvůli tomu, jak se v něm cítí."}, "en": {"title": "Vila GulfSide · Beachfront Homesite on Longboat Key, Florida · Gallery Point", "metadesc": "A beachfront homesite on a quiet private lane on Longboat Key. Clean white sand, Gulf views, minutes from downtown Sarasota. Work No. 004 in the Gallery Point collection.", "n.kdo": "Who we are", "n.kol": "Collection", "n.pri": "Approach", "n.inv": "Investors", "n.kon": "Contact", "m.loc": "Prague · Czech Republic · United States", "hero.sub": "Residences composed like <span class=\"anno-wrap\">works of art.<span class=\"anno\">emotion</span></span>", "hero.m1": "Boutique developer", "hero.m3": "Est. MMXXVI", "hero.cue": "Enter", "kdo.l": "Who we are", "kdo.r": "Top of the market", "kdo.big": "We do not build often. We build <span class=\"em\">exceptionally<svg class=\"u\" viewBox=\"0 0 200 12\" preserveAspectRatio=\"none\"><path d=\"M3 8 Q60 3 110 7 T197 6\"/></svg></span>.", "kdo.s1": "Gallery Point is a boutique developer from Prague. We work only at the very top of the market: private houses and residential buildings in places that do not repeat, in the Czech Republic and the United States.", "kdo.s2": "We own, finance and run every project from the land to the handover. That is why there are few of them. And why we speak of them as a collection.", "kdo.anno": "no portraits. the work speaks for us.", "kdo.zl": "Behind the brand", "kdo.h3": "Capital, experience and selection.", "kdo.p1": "Gallery Point is backed by strong private capital and two decades of experience between Prague and Florida's Gulf coast. We build from a position of strength: we see hundreds of opportunities and choose a handful. No compromises in the brief.", "kdo.p2": "We do not talk about the size of our investments. The works speak for them.", "kdo.sig": "point · Prague", "kol.l": "Collection", "kol.no": "Work", "kol.r": "Five works · Two continents", "kol.h2": "Selected works", "kol.sub": "The collection grows only by works that hold their own in it, between Bohemia and the Gulf of Mexico. Here we show it, we do not sell it. The full catalog is sent on request.", "st.done": "Completed", "st.prog": "In progress", "st.prep": "In preparation", "st.design": "In design", "st.land": "Land secured", "st.sold": "Sold", "kol.cta": "Request the full catalogue", "map.l": "Between two shores", "map.r": "Prague and Longboat Key", "map.h2": "Two shores, one collection", "map.sub": "Five thousand miles between the Prague atelier and the Gulf of Mexico coast. The same standard, the same care.", "map.prg": "Prague", "map.prgc": "50.08° N · 14.43° E", "map.lbk": "Longboat Key", "map.lbkc": "27.39° N · 82.65° W", "map.d": "≈ 8,300 km", "t.head": "The making path", "t.sub": "From land to handover", "t.s1": "Land", "t.s2": "First sketch", "t.s3": "Documentation", "t.s4": "Construction", "t.s5": "Handover", "t.sold": "Sold", "t.now": "we are here now", "p.web": "Project website", "p.websoon": "Coming soon", "p.weben": "Open project website", "e404.k": "Error 404", "e404.h": "This page is not hanging in the gallery yet.", "e404.p": "The work you are looking for is not here. It may have moved, or it may still be in the making. Please return to the collection.", "e404.cta": "Back to the collection", "pri.l": "Approach", "pri.r": "A thousand decisions before the first brick", "pri.h2": "How a work is made", "pri.sub": "Value is not made on site. It is made in the decisions most of the market skips. We show four of them.", "pri.1h": "Place", "pri.1a": "We search for land for years and buy only what will not repeat: the last plots in a neighbourhood, a view that cannot be built over, a shore where nothing more will be built.", "pri.1b": "The place is the only part of a work that cannot be drawn. So we start there.", "pri.1c": "The land · No. 003 · Vila Bayou Sound", "pri.2h": "Architecture", "pri.2a": "For every work we choose an architect whose hand belongs to the place. The first sketches are made by hand. Software comes once the essential is decided.", "pri.2anno": "first lines, by hand", "pri.2c": "First sketch · No. 005 · Hotel Longboat Key", "pri.3h": "Material and detail", "pri.3a": "We draw until there is nothing left to invent on site. A roof is never just a roof. It is a steel standing seam, a Galvalume® finish, a slope of exactly 3:12.", "pri.3b": "Our construction documentation goes to a depth that is not the habit of the market. A specimen beside.", "pri.3c": "Roof detail · drawing 14 of 212 · No. 004", "pri.4h": "Execution", "pri.4lede": "We build once it is decided. And we hand over once the work matches the drawings.", "pri.4t": "Vila Hřebenky", "pri.4c": "No. 001 · Prague 5 · Private residence · Completed MMXXIV", "mi.1t": "Prague", "mi.1p": "Residential houses in neighbourhoods with a name. Our home and our standard.", "mi.1l": "Works No. 001 · 002", "mi.2t": "Longboat Key, Florida", "mi.2p": "An island in the Gulf of Mexico where our roots go back twenty years. The second light of the collection.", "mi.2l": "Works No. 003 · 004 · 005", "mi.3t": "Czech countryside", "mi.3p": "We look for more places that families return to for generations. We buy land before it is talked about.", "mi.3l": "Acquisitions", "mi.l": "Places", "mi.r": "Prague · Longboat Key", "mi.h2": "We are operating in", "kap.l": "Capital, experience", "kap.r": "and selection.", "inv.hl": "The collection", "inv.hr": "will grow.", "inv.l": "For investors", "inv.r": "In preparation", "inv.h2": "The collection will grow.", "inv.p1": "We are preparing an investment fund that will open selected Gallery Point projects to a small circle of qualified investors. Assembled with the same care as the houses themselves.", "inv.p2": "We are not raising capital yet. We are collecting interest. Leave your address and you will be the first we contact.", "inv.ph": "your@address.com", "inv.btn": "Join the list", "inv.ok": "Noted. You will be the first to know.", "inv.err": "Could not send. Please write to us directly at hello@gallerypoint.cz.", "inv.badge": "By invitation only", "inv.fine": "In preparation · Nothing on this page is an offer of securities or investment advice", "kon.l": "Contact", "kon.r": "Acquisitions, plots and quiet ideas", "kon.h2": "Start a <span class=\"em\">conversation</span>.", "kon.1": "Write", "kon.2": "Prague", "kon.2v": "Czech Republic", "kon.3": "Florida", "kon.3v": "Longboat Key, USA", "kon.4": "Follow", "f.c": "© MMXXVI Gallery Point · All rights reserved", "f.set": "Set in Larken · Composed in Prague", "p.kicker": "Work No.", "p.cat": "Catalogue entry", "p.catl": "From the catalogue", "p.f1": "Number", "p.f2": "Place", "p.f3": "Type", "p.f4": "Status", "p.int": "Intent", "p.sr": "The sketch", "p.srr": "First lines, by hand", "p.skanno": "architect's hand", "p.srl": "architect's sketch", "p.srp": "photograph", "p.det": "A thousand decisions", "p.detr": "From the construction documentation", "p.spec1": "steel standing seam with Galvalume® finish and a slope of 3:12", "p.spec2": "triple glazing in an aluminium frame with a 38 mm sightline", "p.fot": "Photographs", "p.fotr": "From the hall of the work", "p.next": "Next work", "p.back": "Back to the collection", "h.day": "A day in the house", "h.dayr": "A hotel is measured in time, not metres", "h.d1": "The sound of the sea wakes you. Coffee on a terrace above the beach.", "h.d2": "An empty beach within reach. A few barefoot steps to the Gulf.", "h.d3": "The evening belongs to the sunset over the sea. And to the veranda.", "h.eds": "Rooms as editions", "h.edsr": "Every room is a numbered piece", "h.e1": "Gulf room", "h.e2": "Bayou room", "h.e3": "The suite", "h.edn": "Details to come", "w.001.t": "Private residence", "w.001.i": "A family residence on the green ridge of Prague 5. Light leads the house, not square metres.", "t.note.001": "finished. and in good hands.", "w.002.t": "Private residence", "w.002.i": "A villa above Podolí with views of Prague Castle and the whole city. A panorama that does not repeat.", "t.note.002": "everything is being decided now.", "w.003.t": "Private residence", "w.003.i": "A waterfront home on a Longboat Key canal, looking at the water through mangroves. One of the most striking in the community.", "t.note.003": "rising.", "w.004.t": "Private residence", "w.004.i": "A homesite right on a Gulf of Mexico beach, on a quiet private lane. For now, just the place and the evening light.", "t.note.004": "just the place and the light, for now.", "w.005.t": "Hotel", "w.005.i": "A boutique hotel right above the sea. Mornings of surf, evenings of the sun setting into the Gulf.", "t.note.005": "the permits, and the first sketch.", "kon.get": "Get in touch", "kon.co": "GALLERY POINT a.s.", "kon.ico": "IČO: 24517305", "kon.addr": "Nad Hlinkem 1202/2, Košiře, 150 00 Prague", "kon.copyright": "2026 © Gallery Point", "kon.ig": "Instagram", "hero.cta": "View the collection", "kol.open": "View the work", "fil.l": "Philosophy", "fil.r": "Works, not projects", "fil.big": "The market builds projects. We compose <span class=\"em\">works<svg class=\"u\" viewBox=\"0 0 200 12\" preserveAspectRatio=\"none\"><path d=\"M3 8 Q60 3 110 7 T197 6\"/></svg></span>.", "fil.p1": "Gallery Point grew out of a simple conviction: a house can be a work of art. So we do not build a portfolio, we build a collection. Every work carries a number, an intent and a place, and it enters the collection only if it stands beside the others. We always begin with the land, because the place is the only part of a work that cannot be designed. We buy the last plots in neighbourhoods with a name, views that cannot be built over, shores where nothing more will be built.", "fil.p2": "Each work then stays in one hand. We own it, finance it and run it, from the first sketch to the handover, backed by private capital and two decades between Prague and the Gulf of Mexico. We do not have to compromise, so we do not. We draw until there is nothing left to invent on site, and we hand over once the house matches the drawings. And we measure it by what remains when you stop counting square metres: light, view and quiet.", "w.001.p1": "Hřebenky is one of those Prague addresses that are inherited rather than bought. A street of old villas, mature gardens, and a quiet the city has almost lost. We composed the house to belong here: the classic hand the street speaks in, with modern elements where they serve daily life. Exceptional without needing to stand out. Quiet luxury in its purest form.", "w.001.p2": "Inside, the house is arranged into independent parts: a large family lives under one roof, yet each in their own space. You meet over morning coffee and retreat to your own calm in the evening. The garden is screened from the surroundings and composed like a room under the open sky. Close the gate and Prague disappears. What remains is light, green, and silence.", "w.002.p1": "There are views of Prague people photograph, and views people live with. From Podolí you look straight at the Castle and across the rooftops of the whole city: a panorama that fades into a silhouette at night and lights up before the streets below you in the morning. Places like this are finite. This is one of the last.", "w.002.p2": "A new villa in a modern hand is taking shape here, in a neighborhood that is transforming and drawing people of the same standard. The kind of neighborhood Prague rarely offers: new houses, its own community, no compromises. The view stays open forever, no one looks into the windows, and the garden is composed as a place of calm. And when you leave, the center and the highway are minutes away, without the traffic.", "w.003.p1": "There are streets on Longboat Key you do not find by accident. This one runs through the middle of a private club community where neighbors know each other by name and unfamiliar cars do not appear. The house stands right on the canal: a boat rests at its own dock, and open water begins a few minutes' cruise from breakfast.", "w.003.p2": "The hand belongs to a renowned architect, and it shows. Generous spaces, a siting that makes the house one of the most striking in the community, and a view that cannot be engineered: the canal shimmering through bonsai mangroves, silver in the morning, gold in the evening. The work is in transformation now. When it is finished, it will look as if it had always stood here.", "w.004.p1": "There are few places where the beach begins beyond your garden. A small private lane, a handful of homes, and then nothing but white sand and the Gulf of Mexico. No hotels, no tourists, no noise. Just the sea you hear through an open window, and a beach where the only footprints in the evening are your own.", "w.004.p2": "Longboat Key guards its intimacy: commerce is kept away and nature has the final word. An island the whole of America knows, and yet it has stayed quiet. A family home will rise here, composed around a single theme: the view of the sea and the light that turns into a sunset over the Gulf every evening. And when the city calls, downtown Sarasota is minutes away.", "w.005.p1": "We are preparing its transformation into the kind of boutique resort that has nearly vanished from Florida's coast: few suites, generous space, and the sea within reach. Oceanfront in the true sense of the word. The surf wakes you in the morning, the beach belongs to guests alone by day, and in the evening you watch from the veranda as the sun sets into the Gulf.", "w.005.p2": "Here we understand hospitality as curatorship. Generous suites composed for long stays, and service devoted to a single person: the guest. No crowds and no noise. Just calm, quality in every detail, and the rhythm of an island set by the sea. A place people return to for the way it makes them feel."}};

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function imgFail(el){el.style.display='none';const p=el.closest('.ph');if(p)p.classList.add('img-missing');}
const stored=localStorage.getItem('gp-lang');
const param=new URLSearchParams(location.search).get('lang');
let LANG=stored||param||((navigator.language&&/^(cs|sk)/i.test(navigator.language))?'cs':'en');
if(!I18N[LANG])LANG='cs';
function setLang(l,persist){LANG=l;if(persist)localStorage.setItem('gp-lang',l);document.documentElement.lang=l;
document.querySelectorAll('[data-i]').forEach(el=>{const v=I18N[l][el.dataset.i];if(v==null)return;if(el.hasAttribute('data-html'))el.innerHTML=v;else el.textContent=v;});
if(I18N[l].title)document.title=I18N[l].title;
const m=document.querySelector('meta[name=description]');if(m&&I18N[l].metadesc)m.content=I18N[l].metadesc;
document.querySelectorAll('#langs span').forEach(s=>s.classList.toggle('on',s.dataset.l===l));}
document.querySelectorAll('#langs span').forEach(s=>s.addEventListener('click',()=>setLang(s.dataset.l,true)));
setLang(LANG,false);
if(!stored&&!param){try{fetch('https://api.country.is',{signal:AbortSignal.timeout(2500)}).then(r=>r.json()).then(d=>{const want=(d.country==='CZ'||d.country==='SK')?'cs':'en';if(want!==LANG)setLang(want,false);}).catch(()=>{});}catch(e){}}
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target);}});},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
document.querySelectorAll('svg.draw').forEach(svg=>{const ps=[...svg.querySelectorAll('path')];ps.forEach((p,i)=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.style.transitionDelay=(i*0.13)+'s';});
new IntersectionObserver((es,obs)=>{es.forEach(e=>{if(e.isIntersecting){svg.classList.add('go');obs.disconnect();}});},{threshold:.35}).observe(svg);});
const ph=document.getElementById('ph');
const onSc=()=>ph.classList.toggle('sc',scrollY>8);onSc();addEventListener('scroll',onSc,{passive:true});
const cur=document.getElementById('cur');
if(cur&&matchMedia('(pointer:fine)').matches&&!reduced){let x=innerWidth/2,y=innerHeight/2,tx=x,ty=y;
addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;});
(function loop(){x+=(tx-x)*0.18;y+=(ty-y)*0.18;cur.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;requestAnimationFrame(loop);})();
const grow=['a','button'].join(',');
addEventListener('mouseover',e=>{if(e.target.closest(grow))cur.classList.add('big');});
addEventListener('mouseout',e=>{if(e.target.closest(grow))cur.classList.remove('big');});}
